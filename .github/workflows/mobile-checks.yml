name: Matkontroll mobile checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: matkontroll-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: One-off OFF search diagnostic
        if: "contains(github.event.head_commit.message, 'diag: probe')"
        continue-on-error: true
        run: node scripts/off-api-diagnostic.cjs
      - name: Unit tests
        run: node --test tests/*.test.cjs
